# Publica la carpeta app/ en GitHub Pages en cada push a main.
#
# La primera vez, «configure-pages» habilita Pages por API gracias a
# enablement: true. Si tu plan o los permisos del repositorio no lo permiten,
# actívalo a mano en Settings › Pages › Source: GitHub Actions.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        with:
          # Crea la configuración de Pages si el repositorio aún no la tiene.
          enablement: true

      # Los datos ya están versionados en app/data, así que no hace falta
      # reconstruirlos: se publica la carpeta tal cual.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
          # app/.nojekyll empieza por punto y si no se incluye no se sube.
          include-hidden-files: true

      - id: despliegue
        uses: actions/deploy-pages@v5
